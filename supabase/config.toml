# Emails de connexion (inscription, mot de passe oublié…) : envoyés par la fonction envoi-email-auth
# via Brevo. Supabase Auth l'appelle avec une signature (secret partagé), sans clé d'API.
[functions.envoi-email-auth]
verify_jwt = false

[auth]
site_url = "https://artiflow-pro.com"
additional_redirect_urls = ["https://artiflow-pro.com/**", "https://www.artiflow-pro.com/**", "http://localhost:3000/**"]

[auth.hook.send_email]
enabled = true
uri = "https://goaaigufumbsjndtbcup.supabase.co/functions/v1/envoi-email-auth"
# Secret lu dans l'environnement au moment du « supabase config push » (jamais écrit dans ce fichier).
secrets = "env(SEND_EMAIL_HOOK_SECRET)"
