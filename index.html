  <!-- Police critique : on précharge la feuille Google Fonts dès le début du
       <head>, pour que le premier rendu utilise déjà la bonne police (moins de
       décalage de texte). Le style est ensuite appliqué par le script injecté
       un peu plus bas : le préchargement ne bloque rien, il chauffe le cache. -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap"
  />

  <!-- Style critique minimal, posé directement dans la page : dès le tout pre-
       mier rendu, le fond, la police de repli, les couleurs de texte et le
       dimensionnement sont déjà bons, sans attendre la feuille principale. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { background-color: #fdfcf8; }
    @supports (color: oklch(0.5 0 0)) { html { background-color: oklch(0.985 0.006 85); } }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #fdfcf8;
      color: #2b211a;
      font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @supports (color: oklch(0.5 0 0)) {
      body { background-color: oklch(0.985 0.006 85); color: oklch(0.16 0.015 50); }
    }
    h1, h2, h3, h4, h5 {
      font-family: 'Bricolage Grotesque', 'Manrope', ui-sans-serif, system-ui, sans-serif;
      margin: 0;
    }
    p { margin: 0; }
    #root { min-height: 100vh; }
  </style>

  <!-- Feuilles de style non critiques (polices + icônes) : injectées par script
       après analyse de la page, donc plus aucun <link rel="stylesheet"> n'est
       analysé au rendu initial. Font Awesome a été retiré : le projet n'utilise
       que les icônes Remix (ri-*). -->
  <script>
    (function () {
      var feuilles = [
        "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap",
        "https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css"
      ];
      for (var i = 0; i < feuilles.length; i++) {
        var l = document.createElement("link");
        // Préchargement : la feuille se télécharge sans bloquer le rendu, puis
        // devient active dès qu'elle est prête. Les polices et icônes ne
        // retardent donc plus l'affichage.
        l.rel = "preload";
        l.as = "style";
        // Déjà géré ici : on le marque pour que le script de chargement
        // asynchrone ne s'en occupe pas une seconde fois.
        l.setAttribute("data-css-async", "fait");
        l.onload = function () { this.rel = "stylesheet"; };
        l.href = feuilles[i];
        document.head.appendChild(l);
      }
    })();
  </script>
